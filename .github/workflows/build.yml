name: Compilar Tesis y Articulos

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Permite ejecutarlo manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Usamos la imagen que acabas de subir
    container:
      image: ghcr.io/asoleal/tesis-bsf-base:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Compilar todos los articulos
        run: |
          make articulos

      - name: Subir PDFs como artefactos
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: articulos-pdf
          path: |
            articulos/**/*.pdf
          retention-days: 5