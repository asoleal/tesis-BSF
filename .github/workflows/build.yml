name: Compilar Tesis y Presentación

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build_latex:
    runs-on: ubuntu-latest

    # TeX Live dentro de contenedor
    container: texlive/texlive:latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # Evita error "dubious ownership" al correr git dentro del container
      - name: Configurar Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Necesario para XeLaTeX + fontspec (p.ej., Latin Modern Roman/Sans)
      - name: Instalar fuentes para XeLaTeX (fontspec)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends fontconfig fonts-lmodern
          fc-cache -f -v

      # --- COMPILACIÓN ---
      # Sin -f: si hay error real, el workflow debe fallar.
      - name: Compilar Tesis
        run: |
          latexmk -pdfxe -interaction=nonstopmode -file-line-error -halt-on-error tesis/tesis.tex

      - name: Compilar Presentación
        run: |
          latexmk -pdfxe -interaction=nonstopmode -file-line-error -halt-on-error presentacion/presentacion.tex

      # --- SUBIR RESULTADOS ---
      - name: Subir PDFs
        uses: actions/upload-artifact@v4
        with:
          name: Documentos_Finales
          path: |
            tesis/tesis.pdf
            presentacion/presentacion.pdf
          if-no-files-found: error
