name: Compilar Tesis y Presentación

on:
  push:
    branches: [ "main", "master", "reorganizacion-estructura" ] # Añadí tu rama de trabajo
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build_latex:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Instalar fuentes para XeLaTeX (fontspec)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends fontconfig fonts-lmodern
          fc-cache -f -v

      # --- COMPILACIÓN DE TESIS ---
      - name: Compilar Tesis
        working-directory: ./tesis  # <--- Crucial: Entra a la carpeta tesis
        run: |
          # Al estar dentro de /tesis, latexmk encuentra 'preambulo/' sin problemas
          latexmk -pdfxe -interaction=nonstopmode -file-line-error -halt-on-error tesis.tex

      # --- COMPILACIÓN DE PRESENTACIÓN ---
      - name: Compilar Presentación
        working-directory: ./presentacion # <--- Crucial: Entra a la carpeta presentacion
        run: |
          latexmk -pdfxe -interaction=nonstopmode -file-line-error -halt-on-error presentacion.tex

      # --- SUBIR RESULTADOS ---
      - name: Subir PDFs
        uses: actions/upload-artifact@v4
        with:
          name: Documentos_Finales
          path: |
            tesis/tesis.pdf
            presentacion/presentacion.pdf
          if-no-files-found: error