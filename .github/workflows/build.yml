name: Compilar Tesis, Presentación y Artículos

on:
  push:
    branches: [ "main", "master", "reorganizacion-estructura" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build_latex:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Instalar fuentes para XeLaTeX
        run: |
          apt-get update
          apt-get install -y --no-install-recommends fontconfig fonts-lmodern
          fc-cache -f -v

      # --- COMPILACIÓN DE TESIS ---
      - name: Compilar Tesis
        working-directory: ./tesis
        run: |
          latexmk -pdfxe -interaction=nonstopmode -file-line-error -halt-on-error tesis.tex

      # --- COMPILACIÓN DE PRESENTACIÓN ---
      - name: Compilar Presentación
        working-directory: ./presentacion
        run: |
          latexmk -pdfxe -interaction=nonstopmode -file-line-error -halt-on-error presentacion.tex

      # --- COMPILACIÓN AUTOMÁTICA DE ARTÍCULOS ---
      - name: Compilar todos los artículos (Ciclo Automático)
        run: |
          # Busca todos los archivos main.tex dentro de articulos/
          find articulos -name "main.tex" | while read -r main_file; do
            # Obtiene la carpeta que contiene ese main.tex
            dir=$(dirname "$main_file")
            echo "--------------------------------------------------"
            echo "Compilando artículo en: $dir"
            echo "--------------------------------------------------"
            
            # Ejecuta latexmk dentro de esa carpeta específica
            latexmk -pdfxe -interaction=nonstopmode -file-line-error -halt-on-error \
                    -working-directory="$dir" "$main_file"
          done

      # --- SUBIR RESULTADOS ---
      - name: Subir PDFs
        uses: actions/upload-artifact@v4
        with:
          name: Documentos_Finales
          path: |
            tesis/tesis.pdf
            presentacion/presentacion.pdf
            articulos/**/*.pdf
          if-no-files-found: error