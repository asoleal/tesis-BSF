name: Compilar Tesis y Presentación

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build_latex:
    runs-on: ubuntu-latest
    # Usamos la misma imagen potente que usas localmente
    container: texlive/texlive:latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # IMPORTANTE: Configuramos git para confiar en el directorio
      # (Evita error "dubious ownership" al correr comandos git dentro del container)
      - name: Configurar Git Safe Directory
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      # --- COMPILACIÓN ---
      # Usamos latexmk con xelatex, EXACTAMENTE como en tu Makefile local.
      # El flag -f fuerza la generación del PDF aunque falten referencias.

      - name: Compilar Tesis y Presentación
        run: |
          latexmk -xelatex -synctex=1 -interaction=nonstopmode -file-line-error -outdir=. -f tesis.tex
          latexmk -xelatex -synctex=1 -interaction=nonstopmode -file-line-error -outdir=. -f presentacion.tex

      # --- SUBIR RESULTADOS ---
      - name: Subir PDFs
        uses: actions/upload-artifact@v4
        with:
          name: Documentos_Finales
          path: |
            tesis.pdf
            presentacion.pdf
          if-no-files-found: warn
