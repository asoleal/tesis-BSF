name: Compilar Articulos

on:
  push:
    paths:
      - 'articulos/**'
  workflow_dispatch:

jobs:
  detectar:
    runs-on: ubuntu-latest
    outputs:
      carpetas: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Aquí listamos tus carpetas. Solo se activará la que cambie.
          filters: |
            articulos/00-red-neuronal: 'articulos/00-red-neuronal/**'
            articulos/01-pinn-biomasa: 'articulos/01-pinn-biomasa/**'
            articulos/02-sensores-calibracion: 'articulos/02-sensores-calibracion/**'
            articulos/03-pgnn-sistema: 'articulos/03-pgnn-sistema/**'
            articulos/04-hardware-dashboard: 'articulos/04-hardware-dashboard/**'

  build:
    needs: detectar
    # Solo corre si detectó cambios en alguna de esas carpetas
    if: ${{ needs.detectar.outputs.carpetas != '[]' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/asoleal/tesis-bsf-base:sha-7c75eab
    strategy:
      matrix:
        # Crea un trabajo independiente por cada carpeta que cambió
        carpeta: ${{ fromJson(needs.detectar.outputs.carpetas) }}
    
    steps:
      - uses: actions/checkout@v4
      - name: Compilar Artículo
        run: |
          echo "Compilando artículo en: ${{ matrix.carpeta }}"
          make articulo dir=${{ matrix.carpeta }}
          
      - name: Subir PDF
        uses: actions/upload-artifact@v4
        with:
          name: pdf-${{ strategy.job-index }}
          path: ${{ matrix.carpeta }}/*.pdf