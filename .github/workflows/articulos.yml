name: Compilar Articulos

on:
  push:
    paths:
      - 'articulos/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/asoleal/tesis-bsf-base:latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Trae todo el historial para poder comparar cambios

      - name: Compilar Carpetas Modificadas
        run: |
          # 1. Identificar carpetas en 'articulos/' con cambios respecto al commit anterior
          # Usamos HEAD^1 para comparar con el commit previo
          MODIFIED_DIRS=$(git diff --name-only HEAD^1 HEAD | grep '^articulos/' | cut -d/ -f1,2 | sort -u)
          
          if [ -z "$MODIFIED_DIRS" ]; then
            echo "No se detectaron cambios en artículos."
            exit 0
          fi

          echo "Carpetas a compilar: $MODIFIED_DIRS"

          # 2. Ejecutar el Makefile por cada carpeta detectada
          for dir in $MODIFIED_DIRS; do
            if [ -d "$dir" ]; then
              make articulo dir=$dir
            fi
          done

      - name: Subir PDFs
        uses: actions/upload-artifact@v4
        with:
          name: articulos-pdf
          path: articulos/**/*.pdf