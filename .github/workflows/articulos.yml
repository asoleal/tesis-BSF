name: Compilar Articulos

on:
  push:
    paths:
      - 'articulos/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/asoleal/tesis-bsf-base:latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Compilar Carpetas Modificadas
        run: |
          echo "DEBUG: Iniciando detección..."
          
          # Intentamos el diff, pero si falla, MODIFIED_DIRS quedará vacío
          MODIFIED_DIRS=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null | grep '^articulos/' | cut -d/ -f1,2 | sort -u || echo "")
          
          # Si el diff falló o no devolvió nada, listamos todas las carpetas manualmente
          if [ -z "$MODIFIED_DIRS" ]; then
            echo "DEBUG: No se pudo comparar commits o no hay cambios. Compilando todo en articulos/..."
            MODIFIED_DIRS=$(find articulos -maxdepth 1 -mindepth 1 -type d)
          fi
          
          echo "DEBUG: Carpetas a procesar: '$MODIFIED_DIRS'"

          for dir in $MODIFIED_DIRS; do
            if [ -d "$dir" ]; then
              echo "==> Compilando: $dir"
              make articulo dir=$dir || echo "ERROR: Falló la compilación de $dir"
              
              echo "==> Verificando PDF en $dir:"
              ls -lh $dir/*.pdf 2>/dev/null || echo "ALERTA: No se generó PDF en $dir"
            fi
          done
          
      - name: Subir PDFs
        uses: actions/upload-artifact@v4
        with:
          name: articulos-pdf
          path: articulos/**/*.pdf