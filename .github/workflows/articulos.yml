name: Compilar Articulos

on:
  push:
    paths:
      - 'articulos/**'
  workflow_dispatch:

jobs:
  detectar-cambios:
    runs-on: ubuntu-latest
    outputs:
      # Aquí guardaremos solo las carpetas que tuvieron cambios
      carpetas: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Filtramos: si cambia algo en articulos/art1, la clave es 'articulos/art1'
          filters: |
            articulos/01-nombre-art: 'articulos/01-nombre-art/**'
            articulos/02-nombre-art: 'articulos/02-nombre-art/**'

  compilar:
    needs: detectar-cambios
    if: ${{ needs.detectar-cambios.outputs.carpetas != '[]' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/asoleal/tesis-bsf-base:latest
    strategy:
      matrix:
        # Solo ejecutará la matrix para las carpetas detectadas en el filtro
        carpeta: ${{ fromJson(needs.detectar-cambios.outputs.carpetas) }}
    
    steps:
      - uses: actions/checkout@v4
      - name: Compilando solo el cambio
        run: make articulo dir=${{ matrix.carpeta }}
      - name: Guardar PDF
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.carpeta }}
          path: ${{ matrix.carpeta }}/*.pdf