name: Compilar Articulos

on:
  push:
    paths:
      - 'articulos/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/asoleal/tesis-bsf-base:latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Compilar Carpetas Modificadas
        run: |
          echo "DEBUG: Evento es ${{ github.event_name }}"
          
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "DEBUG: Comparando ${{ github.event.before }} con ${{ github.sha }}"
            MODIFIED_DIRS=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '^articulos/' | cut -d/ -f1,2 | sort -u)
          else
            MODIFIED_DIRS=$(find articulos -maxdepth 1 -mindepth 1 -type d)
          fi
          
          echo "DEBUG: Carpetas detectadas: '$MODIFIED_DIRS'"

          if [ -z "$MODIFIED_DIRS" ]; then
            echo "ATENCIÓN: No se detectaron carpetas modificadas."
            exit 0
          fi

          for dir in $MODIFIED_DIRS; do
            if [ -d "$dir" ]; then
              echo "==> Iniciando compilación de: $dir"
              make articulo dir=$dir
              echo "==> Contenido de $dir tras compilar:"
              ls -R $dir | grep .pdf || echo "ERROR: No se encontró PDF en $dir"
            fi
          done

      - name: Subir PDFs
        uses: actions/upload-artifact@v4
        with:
          name: articulos-pdf
          path: articulos/**/*.pdf