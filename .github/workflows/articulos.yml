name: Compilar Articulos

on:
  push:
    paths:
      - 'articulos/**'
  workflow_dispatch: # Para cuando quieras forzar la compilación

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/asoleal/tesis-bsf-base:latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Compilar Carpetas Modificadas
        run: |
          # Si es un push, comparamos con el commit anterior. 
          # Si es manual o el primer commit, listamos todas las carpetas.
          if [ "${{ github.event_name }}" = "push" ]; then
            MODIFIED_DIRS=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '^articulos/' | cut -d/ -f1,2 | sort -u)
          else
            MODIFIED_DIRS=$(find articulos -maxdepth 1 -mindepth 1 -type d)
          fi
          
          if [ -z "$MODIFIED_DIRS" ]; then
            echo "No se detectaron cambios."
            exit 0
          fi

          for dir in $MODIFIED_DIRS; do
            if [ -d "$dir" ]; then
              make articulo dir=$dir
            fi
          done

      - name: Subir PDFs
        uses: actions/upload-artifact@v4
        with:
          name: articulos-pdf
          path: articulos/**/*.pdf