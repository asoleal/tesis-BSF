name: Compilar Articulos

on:
  push:
    paths:
      - 'articulos/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/asoleal/tesis-bsf-base:latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Cambiado de 0 a 2 para comparar el commit actual con el anterior

      - name: Compilar Carpetas Modificadas
        run: |
          echo "DEBUG: Iniciando detección..."
          
          # Comparamos el commit anterior (HEAD^) con el actual (HEAD)
          MODIFIED_DIRS=$(git diff --name-only HEAD^ HEAD 2>/dev/null | grep '^articulos/' | cut -d/ -f1,2 | sort -u || echo "")
          
          if [ -z "$MODIFIED_DIRS" ]; then
            echo "DEBUG: No se detectaron cambios específicos en este commit. Revisando si es un push nuevo..."
            # Si HEAD^ falla (por ejemplo, en el primer push de la rama), listamos todo
            MODIFIED_DIRS=$(find articulos -maxdepth 1 -mindepth 1 -type d)
          fi
          
          echo "DEBUG: Carpetas a procesar: '$MODIFIED_DIRS'"

          for dir in $MODIFIED_DIRS; do
            if [ -d "$dir" ]; then
              echo "==> Compilando: $dir"
              make articulo dir=$dir || echo "ERROR: Falló la compilación de $dir"
              
              echo "==> Verificando PDF en $dir:"
              ls -lh $dir/*.pdf 2>/dev/null || echo "ALERTA: No se generó PDF en $dir"
            fi
          done
          
      - name: Subir PDFs
        uses: actions/upload-artifact@v4
        with:
          name: articulos-pdf
          path: articulos/**/*.pdf