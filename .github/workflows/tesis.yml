name: Compilar Tesis

on:
  push:
    paths:
      - 'tesis/**'       # Solo si cambian archivos dentro de tesis/
      - 'Makefile'       # O si cambias el Makefile global
  workflow_dispatch:     # Permite ejecución manual

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/asoleal/tesis-bsf-base:latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Compilar Tesis
        run: make tesis

      - name: Listar archivos para verificar ruta
        run: ls -R tesis/

      - name: Subir PDF de la Tesis
        uses: actions/upload-artifact@v4
        with:
          name: tesis-pdf
          # Busca cualquier PDF dentro de la carpeta tesis/
          path: tesis/*.pdf
          retention-days: 5